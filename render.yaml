services:
  - type: web
    name: helpdesk-crm-api
    runtime: python
    plan: free
    region: singapore
    branch: master
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANALYTICS_DATABASE_URL
        sync: false
      - key: GEOCODE_USER_AGENT
        sync: false
      - key: WHATSAPP_ENABLED
        value: "True"
      - key: WHATSAPP_GRAPH_VERSION
        value: v23.0
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_ASSIGNED
        value: complaint_assigned_engineer
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "91"
      - key: WHATSAPP_SEND_SYNC
        value: "True"
      - key: GEOCODE_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4.1-flash-1017
      - key: AI_BRIEFING_ENABLED
        value: "True"
      - key: AI_BRIEFING_REASONING_EFFORT
        value: none
      - key: USD_TO_INR_RATE
        value: "88.0"
